  version: "3.9"

  services:
    postgres:
      image: postgres:15
      container_name: ecommerce_postgres
      environment:
        POSTGRES_USER: admin
        POSTGRES_PASSWORD: admin
        POSTGRES_DB: ecommerce
      restart: always
      env_file:
        - .env
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U postgres"]
        interval: 5s
        timeout: 5s
        retries: 5

    pipeline:
      build: .
      container_name: ecommerce_pipeline
      depends_on:
        postgres:
          condition: service_healthy
      env_file:
        - .env
      volumes:
        - .:/app
      command: python scripts/scheduler.py

  volumes:
    postgres_data:
